<style>
:root {
  color-scheme: dark;
  --bg: #07070C;
  --card: #12121A;
  --card-2: #15121F;
  --line: #3A3A4A;
  --line-soft: #1E1E2A;
  --ink: #F5F1FF;
  --ink-2: #E6E4EF;
  --ink-3: #C9C6D6;
  --ink-soft: #A0A0B0;
  --ink-faint: #8B899A;
  --violet: #7C3AED;
  --violet-2: #A78BFA;
  --violet-3: #C4B5FD;
  --violet-bg: #2A1F47;
  --roast: #F0997B;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(120% 60% at 50% -10%, #1B1230 0%, var(--bg) 60%) no-repeat, var(--bg);
  color: var(--ink-2);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#app.enter { animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #app.enter { animation: none; } }
p, h1, h2, blockquote { margin: 0; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { text-decoration: none; }
:focus-visible { outline: 2px solid var(--violet-2); outline-offset: 2px; }

.brand { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; font-weight: 700; padding: 4px 0 8px; }
.brand-logo { width: 32px; height: 32px; border-radius: 8px; }
.eyebrow { color: var(--violet-3); font-size: 13px; font-weight: 700; letter-spacing: .04em; margin-top: 18px; }
.title { color: var(--ink); font-size: 30px; line-height: 1.4; font-weight: 800; letter-spacing: .01em; }
.lede { color: var(--ink-3); font-size: 15px; line-height: 1.9; }
.learn { list-style: none; margin: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid #262636; border-radius: 14px; font-size: 14px; color: var(--ink-3); }
.learn strong { color: var(--ink); display: inline-block; min-width: 6.5em; }
.facts { display: flex; gap: 8px; list-style: none; margin: 4px 0 8px; padding: 0; }
.facts li { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink-3); }
.primary {
  display: block; width: 100%; text-align: center;
  background: var(--violet); color: #fff; font-size: 17px; font-weight: 700;
  border-radius: 14px; padding: 16px;
  box-shadow: 0 8px 24px rgba(124, 58, 237, .35);
}
.primary:active { transform: translateY(1px); }
.fine { color: var(--ink-faint); font-size: 12px; line-height: 1.8; }
.center { text-align: center; }

.top { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
.link { color: var(--violet-2); font-size: 14px; font-weight: 600; padding: 6px 0; }
.center-block { align-self: center; margin-top: 8px; }
.count { color: var(--ink-faint); font-size: 13px; }
.bar { height: 4px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--violet); transition: width .2s ease-out; }
.part { color: var(--violet-3); font-size: 13px; font-weight: 700; margin-top: 10px; }
.intro { color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
.q-row { display: flex; align-items: flex-start; gap: 10px; }
.question { flex: 1; color: var(--ink); font-size: 21px; line-height: 1.5; font-weight: 700; }
.help-button { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-3); font-size: 14px; font-weight: 700; margin-top: 2px; }
.help { color: var(--ink-3); font-size: 13px; line-height: 1.6; background: var(--card-2); border-radius: 10px; padding: 10px 12px; }
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.option {
  text-align: left; width: 100%;
  border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px;
  background: var(--card); color: var(--ink-2); font-size: 15px; line-height: 1.55;
  transition: border-color .12s, background-color .12s;
}
.option:active, .option.on { border-color: var(--violet-2); background: var(--violet-bg); color: var(--ink); }
.option.on { font-weight: 700; }
@media (hover: hover) { .option:hover { border-color: var(--violet-2); } }

.card { background: var(--card); border: 1px solid #262636; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.small { color: var(--ink-faint); font-size: 12px; }
.face-label { color: var(--ink-soft); font-size: 13px; margin-top: 12px; }
.bright { color: var(--ink); font-size: 26px; font-weight: 800; line-height: 1.4; }
.roast { color: var(--roast); font-size: 30px; font-weight: 800; line-height: 1.35; }
.kind { color: var(--ink-3); font-size: 14px; }
.body { color: var(--ink-3); font-size: 14px; line-height: 1.8; }
.card .body { margin-top: 8px; }
.gap { color: var(--violet-3); font-size: 13px; line-height: 1.7; }
.section-sub { color: var(--ink-soft); font-size: 12px; margin-top: 14px; }
.bars { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.bar-row { display: flex; flex-direction: column; gap: 3px; }
.bar-axis { color: var(--ink-faint); font-size: 11px; }
.bar-line { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; }
.track { height: 8px; background: var(--line-soft); border-radius: 4px; overflow: hidden; }
.track-fill { height: 100%; background: var(--violet); }

.section { color: var(--ink); font-size: 17px; font-weight: 800; margin-top: 18px; }
.partners { display: flex; flex-direction: column; gap: 10px; }
.partner { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.partner.lead { border-color: var(--violet-2); background: linear-gradient(180deg, #1D1630, var(--card)); }
.rank { color: var(--violet-2); font-size: 12px; font-weight: 700; }
.partner-name { color: var(--ink); font-size: 24px; font-weight: 800; }
.small-name { font-size: 18px; }
.first-line { margin-top: 10px; color: var(--ink); font-size: 15px; line-height: 1.8; border-left: 3px solid var(--violet); padding: 2px 0 2px 12px; }

.cta { margin-top: 18px; background: var(--card-2); border: 1px solid #3B2F63; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.cta-title { color: var(--ink); font-size: 19px; font-weight: 800; line-height: 1.5; }
.store { margin-top: 4px; }
.search { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid #262636; padding-top: 12px; }
.search-text { color: var(--ink-3); font-size: 13px; line-height: 1.6; }
.search-text strong { color: var(--ink); }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.notice { color: #F5D08A; font-size: 13px; line-height: 1.7; background: #241D10; border-radius: 10px; padding: 10px 12px; }

.share { display: flex; flex-direction: column; gap: 10px; }
.share-image { width: 62%; align-self: center; border-radius: 12px; border: 1px solid #262636; aspect-ratio: 9 / 16; background: var(--card); }
.share-buttons { display: flex; flex-direction: column; gap: 8px; }
.secondary { display: block; width: 100%; text-align: center; border: 1px solid var(--line); border-radius: 12px; padding: 13px; color: var(--ink); font-size: 15px; font-weight: 700; background: var(--card); }
.secondary.strong { border-color: var(--violet-2); }

.footer { display: flex; justify-content: center; gap: 16px; color: var(--ink-faint); font-size: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.footer a { color: var(--ink-soft); text-decoration: underline; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 12px);
  background: #2A2A3A; color: var(--ink); font-size: 13px; padding: 10px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; white-space: nowrap;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
